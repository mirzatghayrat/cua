[dependencies.serde]
features = ["derive"]
version = "1.0.200"

[dependencies.winnow]
version = "1.0"

[dependencies.zvariant]
features = ["enumflags2"]
version = "5.10.1"

[dev-dependencies.criterion]
package = "codspeed-criterion-compat"
version = "4.0.4"

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(tokio_unstable)"]
level = "warn"
priority = 0

[package]
authors = ["Zeeshan Ali Khan <zeeshanak@gnome.org>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["os::unix-apis"]
description = "A collection of D-Bus bus names types"
edition = "2024"
keywords = ["D-Bus", "DBus", "IPC"]
license = "MIT"
name = "zbus_names"
readme = "README.md"
repository = "https://github.com/z-galaxy/zbus/"
rust-version = "1.87"
version = "4.3.2"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-unknown-netbsd", "aarch64-linux-android"]
