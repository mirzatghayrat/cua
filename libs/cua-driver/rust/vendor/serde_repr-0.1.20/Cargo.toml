[dependencies.proc-macro2]
version = "1.0.74"

[dependencies.quote]
version = "1.0.35"

[dependencies.syn]
version = "2.0.46"

[dev-dependencies.rustversion]
version = "1.0.13"

[dev-dependencies.serde]
version = "1.0.166"

[dev-dependencies.serde_json]
version = "1.0.100"

[dev-dependencies.trybuild]
features = ["diff"]
version = "1.0.81"

[lib]
path = "src/lib.rs"

[package]
authors = ["David Tolnay <dtolnay@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["encoding", "no-std", "no-std::no-alloc"]
description = "Derive Serialize and Deserialize that delegates to the underlying repr of a C-like enum."
documentation = "https://docs.rs/serde_repr"
edition = "2021"
keywords = ["serde", "serialization", "integer"]
license = "MIT OR Apache-2.0"
name = "serde_repr"
readme = "README.md"
repository = "https://github.com/dtolnay/serde-repr"
rust-version = "1.56"
version = "0.1.20"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition", "--extern-html-root-url=core=https://doc.rust-lang.org", "--extern-html-root-url=alloc=https://doc.rust-lang.org", "--extern-html-root-url=std=https://doc.rust-lang.org", "--extern-html-root-url=proc_macro=https://doc.rust-lang.org"]
targets = ["x86_64-unknown-linux-gnu"]
