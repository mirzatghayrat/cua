[badges.codecov]
branch = "main"
repository = "bitvecto-rs/bitvec"
service = "github"

[badges.is-it-maintained-issue-resolution]
repository = "bitvecto-rs/bitvec"

[badges.is-it-maintained-open-issues]
repository = "bitvecto-rs/bitvec"

[badges.maintenance]
status = "passively-maintained"

[dependencies.funty]
default-features = false
version = "^2.0"

[dependencies.radium]
version = "0.7"

[dependencies.serde]
default-features = false
optional = true
version = "1"

[dependencies.tap]
version = "1"

[dependencies.wyz]
default-features = false
version = "0.5"

[dev-dependencies.bincode]
version = "1.3"

[dev-dependencies.criterion]
version = "0.3"

[dev-dependencies.rand]
version = "0.8"

[dev-dependencies.serde]
version = "1"

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.serde_test]
version = "1"

[dev-dependencies.static_assertions]
version = "1"

[features]
alloc = []
atomic = []
default = ["atomic", "std"]
std = ["alloc"]
testing = []

[lib]
path = "src/lib.rs"

[package]
categories = ["data-structures", "embedded", "no-std", "rust-patterns"]
description = "Addresses memory by bits, for packed collections and bitfields"
documentation = "https://docs.rs/bitvec/latest/bitvec"
edition = "2021"
homepage = "https://bitvecto-rs.github.io/bitvec"
include = ["Cargo.toml", "LICENSE.txt", "README.md", "doc/**/*.md", "src/**/*.rs", "benches/*.rs"]
keywords = ["bitfields", "bitmap", "bitstream", "bitvec", "bitvector"]
license = "MIT"
name = "bitvec"
readme = "README.md"
repository = "https://github.com/bitvecto-rs/bitvec"
resolver = "2"
rust-version = "1.56"
version = "1.0.1"

[package.metadata.docs.rs]
features = ["atomic", "serde", "std"]
