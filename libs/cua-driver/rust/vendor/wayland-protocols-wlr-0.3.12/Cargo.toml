[dependencies.bitflags]
version = "2"

[dependencies.wayland-backend]
version = "0.3.15"

[dependencies.wayland-client]
optional = true
version = "0.31.14"

[dependencies.wayland-protocols]
version = "0.32.12"

[dependencies.wayland-scanner]
version = "0.31.10"

[dependencies.wayland-server]
optional = true
version = "0.31.13"

[features]
client = ["wayland-client", "wayland-protocols/client"]
server = ["wayland-server", "wayland-protocols/server"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Elinor Berger <elinor@safaradeg.net>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["gui", "api-bindings"]
description = "Generated API for the WLR wayland protocol extensions"
documentation = "https://docs.rs/wayland-protocols-wlr/"
edition = "2021"
keywords = ["wayland", "client", "server", "protocol", "extension"]
license = "MIT"
name = "wayland-protocols-wlr"
readme = "README.md"
repository = "https://github.com/smithay/wayland-rs"
rust-version = "1.71"
version = "0.3.12"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
