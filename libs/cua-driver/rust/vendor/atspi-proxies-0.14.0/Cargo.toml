[dependencies.atspi-common]
version = "0.14.0"

[dependencies.serde]
default-features = false
features = ["derive"]
version = "^1.0.200"

[dependencies.zbus]
default-features = false
features = ["async-io"]
version = "5.5"

[dev-dependencies.atspi-common]
version = "0.14.0"

[dev-dependencies.byteorder]
version = "1.4"

[dev-dependencies.futures-lite]
default-features = false
version = "2.6.0"

[dev-dependencies.rename-item]
version = "0.1.0"

[dev-dependencies.serde_json]
version = "1.0.96"

[dev-dependencies.serde_plain]
version = "1.0.1"

[dev-dependencies.tokio]
default-features = false
features = ["macros", "rt-multi-thread"]
version = "1.38.2"

[dev-dependencies.tokio-stream]
version = "0.1.1"

[dev-dependencies.tokio-test]
version = "0.4.2"

[dev-dependencies.tracing]
version = "0.1.40"

[features]
default = ["wrappers"]
wrappers = []

[lib]
path = "src/lib.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["accessibility", "api-bindings"]
description = "AT-SPI2 proxies to query or manipulate UI objects"
edition = "2021"
homepage = "https://github.com/odilia-app/atspi"
include = ["LICENSE-*", "README.md", "src/**/*"]
keywords = ["a11y", "accessibility", "linux", "screen-reader", "tts"]
license = "Apache-2.0 OR MIT"
name = "atspi-proxies"
readme = "README.md"
repository = "https://github.com/odilia-app/atspi"
rust-version = "1.77.2"
version = "0.14.0"

[package.metadata.release]
publish = true
release = true
