[dependencies.anyhow]
version = "1"

[dependencies.bitflags]
version = "2"

[dependencies.libc]
version = "0.2"

[dependencies.nix]
features = ["signal", "fs"]
version = "0.27"

[dependencies.once_cell]
version = "1.0"

[dependencies.pw_sys]
package = "pipewire-sys"
version = "0.8"

[dependencies.spa]
package = "libspa"
version = "0.8"

[dependencies.spa_sys]
package = "libspa-sys"
version = "0.8"

[dependencies.thiserror]
version = "1"

[dev-dependencies.clap]
features = ["derive"]
version = "4.3.2"

[dev-dependencies.once_cell]
version = "1.5"

[features]
v0_3_32 = []
v0_3_33 = ["spa/v0_3_33", "v0_3_32"]
v0_3_34 = ["v0_3_33"]
v0_3_39 = ["v0_3_34"]
v0_3_40 = ["v0_3_39"]
v0_3_41 = ["v0_3_40"]
v0_3_43 = ["v0_3_41"]
v0_3_44 = ["v0_3_43"]
v0_3_45 = ["v0_3_44"]
v0_3_49 = ["v0_3_45"]
v0_3_53 = ["v0_3_49"]
v0_3_57 = ["v0_3_53"]
v0_3_64 = ["v0_3_57"]
v0_3_65 = ["spa/v0_3_65", "v0_3_64"]
v0_3_77 = ["v0_3_65"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Tom Wagner <tom.a.wagner@protonmail.com", "Guillaume Desmottes <guillaume.desmottes@collabora.com>"]
categories = ["api-bindings", "multimedia"]
description = "Rust bindings for PipeWire"
documentation = "https://pipewire.pages.freedesktop.org/pipewire-rs/pipewire/"
edition = "2021"
homepage = "https://pipewire.org"
keywords = ["pipewire", "multimedia", "audio", "video"]
license = "MIT"
name = "pipewire"
readme = "README.md"
repository = "https://gitlab.freedesktop.org/pipewire/pipewire-rs"
rust-version = "1.65"
version = "0.8.0"
