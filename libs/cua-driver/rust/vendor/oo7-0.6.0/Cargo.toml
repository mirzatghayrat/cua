[dependencies.aes]
features = ["zeroize"]
optional = true
version = "0.8"

[dependencies.ashpd]
default-features = false
features = ["secret"]
version = "0.13"

[dependencies.async-fs]
optional = true
version = "2.2.0"

[dependencies.async-io]
optional = true
version = "2.6.0"

[dependencies.async-lock]
optional = true
version = "3.4.2"

[dependencies.blocking]
optional = true
version = "1.5.1"

[dependencies.cbc]
features = ["zeroize"]
optional = true
version = "0.1"

[dependencies.cipher]
features = ["zeroize"]
optional = true
version = "0.4"

[dependencies.digest]
optional = true
version = "0.10"

[dependencies.endi]
version = "1.1"

[dependencies.futures-lite]
optional = true
version = "2.6"

[dependencies.futures-util]
version = "0.3"

[dependencies.getrandom]
version = "0.4"

[dependencies.hkdf]
optional = true
version = "0.12"

[dependencies.hmac]
optional = true
version = "0.12"

[dependencies.md-5]
optional = true
version = "0.10"

[dependencies.num]
version = "0.4.0"

[dependencies.num-bigint-dig]
features = ["zeroize"]
version = "0.9"

[dependencies.oo7-macros]
optional = true
version = "0.6"

[dependencies.openssl]
optional = true
version = "0.10"

[dependencies.pbkdf2]
optional = true
version = "0.12"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dependencies.serde_bytes]
version = "0.11"

[dependencies.sha2]
optional = true
version = "0.10"

[dependencies.subtle]
optional = true
version = "2.5"

[dependencies.tokio]
default-features = false
features = ["sync", "fs", "io-util"]
optional = true
version = "1.48"

[dependencies.tracing]
optional = true
version = "0.1"

[dependencies.zbus]
default-features = false
version = "5.12.0"

[dependencies.zbus_macros]
features = ["gvariant"]
version = "5.11"

[dependencies.zeroize]
features = ["zeroize_derive"]
version = "1"

[dependencies.zvariant]
default-features = false
features = ["gvariant", "serde_bytes"]
version = "5.8"

[dev-dependencies.serial_test]
version = "3.3"

[dev-dependencies.tempfile]
version = "3.25"

[dev-dependencies.tokio]
default-features = false
features = ["macros", "rt-multi-thread", "time"]
version = "1.48"

[dev-dependencies.tracing-subscriber]
features = ["env-filter", "fmt"]
version = "0.3"

[features]
async-std = ["zbus/async-io", "dep:async-fs", "dep:async-io", "dep:async-lock", "dep:blocking", "dep:futures-lite", "ashpd/async-io"]
default = ["tokio", "native_crypto"]
native_crypto = ["dep:aes", "dep:cbc", "dep:cipher", "dep:digest", "dep:hkdf", "dep:hmac", "dep:md-5", "dep:pbkdf2", "dep:sha2", "dep:subtle"]
openssl_crypto = ["dep:openssl"]
schema = ["dep:oo7-macros"]
tokio = ["zbus/tokio", "dep:tokio", "ashpd/tokio"]
tracing = ["dep:tracing", "ashpd/tracing"]
unstable = []

[lib]
path = "src/lib.rs"

[package]
authors = ["Bilal Elmoussaoui", "Sophie Herold", "Maximiliano Sandoval"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["os::linux-apis", "os", "api-bindings"]
description = "James Bond went on a new mission and this time as a Secret Service provider"
edition = "2024"
exclude = ["org.freedesktop.Secrets.xml"]
homepage = "https://github.com/linux-credentials/oo7"
keywords = ["keyring", "secret", "service", "portal", "keychain"]
license = "MIT"
name = "oo7"
readme = "README.md"
repository = "https://github.com/linux-credentials/oo7"
rust-version = "1.92"
version = "0.6.0"

[package.metadata.docs.rs]
features = ["unstable"]
rustdoc-args = ["--generate-link-to-definition"]
