[dependencies.byteorder]
version = "1"

[dependencies.keyring-core]
version = "1"

[dependencies.regex]
optional = true
version = "1"

[dependencies.windows-sys]
features = ["Win32_Foundation", "Win32_Security_Credentials"]
version = "0.61.2"

[dependencies.zeroize]
version = "1"

[dev-dependencies.fastrand]
version = "2"

[dev-dependencies.sscanf]
version = "0.5"

[features]
default = ["search"]
search = ["dep:regex"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Daniel Brotsky <dev@brotsky.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = "Windows native credential store for keyring"
edition = "2024"
exclude = [".github/"]
homepage = "https://github.com/open-source-cooperative/keyring-rs/wiki/Keyring"
keywords = ["windows", "credential-manager", "credential-store", "keyring"]
license = "MIT OR Apache-2.0"
name = "windows-native-keyring-store"
readme = "README.md"
repository = "https://github.com/open-source-cooperative/windows-native-keyring-store.git"
rust-version = "1.88"
version = "1.1.0"

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
