[dependencies.async-task]
version = "4.4.0"

[dependencies.concurrent-queue]
version = "2.5.0"

[dependencies.fastrand]
version = "2.0.0"

[dependencies.futures-lite]
default-features = false
version = "2.0.0"

[dependencies.pin-project-lite]
version = "0.2"

[dependencies.slab]
version = "0.4.7"

[dev-dependencies.async-channel]
version = "2.0.0"

[dev-dependencies.async-io]
version = "2.1.0"

[dev-dependencies.async-lock]
version = "3.0.0"

[dev-dependencies.criterion]
default-features = false
features = ["cargo_bench_support"]
version = "0.8"

[dev-dependencies.easy-parallel]
version = "3.1.0"

[dev-dependencies.fastrand]
version = "2.0.0"

[dev-dependencies.futures-lite]
version = "2.0.0"

[dev-dependencies.once_cell]
version = "1.16.0"

[features]
static = []

[lib]
path = "src/lib.rs"

[package]
authors = ["Stjepan Glavina <stjepang@gmail.com>", "John Nunley <dev@notgull.net>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["asynchronous", "concurrency"]
description = "Async executor"
edition = "2021"
exclude = ["/.*"]
keywords = ["asynchronous", "executor", "single", "multi", "spawn"]
license = "Apache-2.0 OR MIT"
name = "async-executor"
readme = "README.md"
repository = "https://github.com/smol-rs/async-executor"
rust-version = "1.65"
version = "1.14.0"

[package.metadata.docs.rs]
all-features = true

[target.'cfg(target_family = "wasm")'.dependencies.futures-lite]
default-features = false
features = ["std"]
version = "2.0.0"
