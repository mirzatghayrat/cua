[dependencies.async-broadcast]
version = "0.7.0"

[dependencies.async-executor]
optional = true
version = "1.11.0"

[dependencies.async-io]
optional = true
version = "2.3.2"

[dependencies.async-lock]
optional = true
version = "3.3.0"

[dependencies.async-process]
optional = true
version = "2.2.2"

[dependencies.async-task]
optional = true
version = "4.7.1"

[dependencies.async-trait]
version = "0.1.80"

[dependencies.blocking]
optional = true
version = "1.6.0"

[dependencies.enumflags2]
features = ["serde"]
version = "0.7.9"

[dependencies.event-listener]
version = "5.3.0"

[dependencies.futures-core]
version = "0.3.30"

[dependencies.futures-lite]
default-features = false
features = ["std"]
version = "2.6.0"

[dependencies.hex]
version = "0.4.3"

[dependencies.ordered-stream]
version = "0.2"

[dependencies.serde]
features = ["derive"]
version = "1.0.200"

[dependencies.serde_repr]
version = "0.1.19"

[dependencies.tokio]
features = ["rt", "rt-multi-thread", "net", "time", "fs", "io-util", "process", "sync", "tracing"]
optional = true
version = "1.37.0"

[dependencies.tracing]
version = "0.1.40"

[dependencies.uuid]
features = ["serde"]
version = "1.8.0"

[dependencies.winnow]
version = "1.0"

[dependencies.zbus_macros]
version = "5.16.0"

[dependencies.zbus_names]
version = "4.3.2"

[dependencies.zvariant]
features = ["enumflags2"]
version = "5.12.0"

[dev-dependencies.criterion]
package = "codspeed-criterion-compat"
version = "4.0.4"

[dev-dependencies.doc-comment]
version = "0.3.3"

[dev-dependencies.futures-util]
default-features = false
features = ["io", "async-await-macro", "async-await"]
version = "0.3.31"

[dev-dependencies.ntest]
version = "0.9.2"

[dev-dependencies.tempfile]
version = "3.10.1"

[dev-dependencies.test-log]
default-features = false
features = ["trace"]
version = "0.2.16"

[dev-dependencies.tokio]
features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "sync", "time", "test-util"]
version = "1.37.0"

[dev-dependencies.tracing-subscriber]
default-features = false
features = ["env-filter", "fmt", "ansi"]
version = "0.3.18"

[features]
async-fs = []
async-io = ["dep:async-io", "async-executor", "async-fs", "async-task", "async-lock", "async-process", "blocking"]
blocking-api = ["zbus_macros/blocking-api"]
bus-impl = ["p2p"]
camino = ["zvariant/camino"]
chrono = ["zvariant/chrono"]
default = ["async-io", "blocking-api"]
heapless = ["zvariant/heapless"]
option-as-array = ["zvariant/option-as-array"]
p2p = ["uuid/v4"]
serde_bytes = ["zvariant/serde_bytes"]
time = ["zvariant/time"]
tokio = ["dep:tokio"]
tokio-vsock = ["dep:tokio-vsock", "tokio"]
url = ["zvariant/url"]
uuid = ["zvariant/uuid"]
vsock = ["dep:vsock", "dep:async-io"]

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(tokio_unstable)"]
level = "warn"
priority = 0

[package]
authors = ["Zeeshan Ali Khan <zeeshanak@gnome.org>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["os::unix-apis"]
description = "API for D-Bus communication"
edition = "2024"
keywords = ["D-Bus", "DBus", "IPC"]
license = "MIT"
name = "zbus"
readme = "README.md"
repository = "https://github.com/z-galaxy/zbus/"
rust-version = "1.87"
version = "5.16.0"

[package.metadata.docs.rs]
features = ["async-io", "blocking-api", "uuid", "url", "time", "chrono", "heapless", "option-as-array", "camino", "bus-impl", "p2p", "tokio", "serde_bytes"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-unknown-netbsd", "aarch64-linux-android"]

[target.'cfg(target_os = "linux")'.dependencies.tokio-vsock]
optional = true
version = "0.7"

[target.'cfg(target_os = "linux")'.dependencies.vsock]
optional = true
version = "0.5.0"

[target."cfg(unix)".dependencies.async-recursion]
version = "1.1.1"

[target."cfg(unix)".dependencies.libc]
default-features = false
version = "0.2"

[target."cfg(unix)".dependencies.rustix]
default-features = false
features = ["net", "process", "std"]
version = "1.1.2"

[target."cfg(windows)".dependencies.async-recursion]
version = "1.1.1"

[target."cfg(windows)".dependencies.uds_windows]
version = "1.1.0"

[target."cfg(windows)".dependencies.windows-sys]
features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_WindowsProgramming", "Win32_Networking", "Win32_Networking_WinSock", "Win32_NetworkManagement", "Win32_NetworkManagement_IpHelper", "Win32_System_IO", "Win32_System_Threading"]
version = "0.61"
