[badges.coveralls]
branch = "main"
repository = "Geal/nom"
service = "github"

[badges.maintenance]
status = "actively-developed"

[badges.travis-ci]
repository = "Geal/nom"

[dependencies.memchr]
default-features = false
version = "2.3"

[dev-dependencies.doc-comment]
version = "0.3"

[dev-dependencies.proptest]
version = "=1.0.0"

[features]
alloc = []
default = ["std"]
docsrs = []
std = ["alloc", "memchr/std"]

[lib]
path = "src/lib.rs"

[package]
authors = ["contact@geoffroycouprie.com"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
categories = ["parsing"]
description = "A byte-oriented, zero-copy, parser combinators library"
documentation = "https://docs.rs/nom"
edition = "2021"
include = ["CHANGELOG.md", "LICENSE", "README.md", ".gitignore", "Cargo.toml", "src/*.rs", "src/*/*.rs", "tests/*.rs", "doc/nom_recipes.md"]
keywords = ["parser", "parser-combinators", "parsing", "streaming", "bit"]
license = "MIT"
name = "nom"
readme = "README.md"
repository = "https://github.com/rust-bakery/nom"
rust-version = "1.65.0"
version = "8.0.0"

[package.metadata.docs.rs]
all-features = true
features = ["alloc", "std", "docsrs"]
rustdoc-args = ["--generate-link-to-definition"]

[profile.bench]
codegen-units = 1
debug = 2
lto = true
