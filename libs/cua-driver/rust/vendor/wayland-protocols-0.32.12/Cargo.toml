[dependencies.bitflags]
version = "2"

[dependencies.wayland-backend]
version = "0.3.15"

[dependencies.wayland-client]
optional = true
version = "0.31.14"

[dependencies.wayland-scanner]
version = "0.31.10"

[dependencies.wayland-server]
optional = true
version = "0.31.13"

[features]
client = ["wayland-client"]
server = ["wayland-server"]
staging = []
unstable = []

[lib]
path = "src/lib.rs"

[package]
authors = ["Elinor Berger <elinor@safaradeg.net>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["gui", "api-bindings"]
description = "Generated API for the officials wayland protocol extensions"
documentation = "https://docs.rs/wayland-protocols/"
edition = "2021"
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE.txt", "/protocols/COPYING", "/protocols/stable/*/*.xml", "/protocols/staging/*/*.xml", "/protocols/unstable/*/*.xml", "!/protocols/unstable/xdg-shell/xdg-shell-unstable-v5.xml", "!/protocols/unstable/xdg-shell/xdg-shell-unstable-v6.xml", "!/protocols/unstable/linux-dmabuf/linux-dmabuf-unstable-v1.xml", "!/protocols/unstable/tablet/tablet-unstable-v2.xml"]
keywords = ["wayland", "client", "server", "protocol", "extension"]
license = "MIT"
name = "wayland-protocols"
readme = "README.md"
repository = "https://github.com/smithay/wayland-rs"
rust-version = "1.71"
version = "0.32.12"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
