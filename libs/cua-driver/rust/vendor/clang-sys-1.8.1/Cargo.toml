[build-dependencies.glob]
version = "0.3"

[dependencies.glob]
version = "0.3"

[dependencies.libc]
default-features = false
version = "0.2.39"

[dependencies.libloading]
optional = true
version = "0.8"

[dev-dependencies.glob]
version = "0.3"

[dev-dependencies.lazy_static]
version = "1"

[dev-dependencies.tempfile]
version = ">=3.0.0, <3.7.0"

[features]
clang_10_0 = ["clang_9_0"]
clang_11_0 = ["clang_10_0"]
clang_12_0 = ["clang_11_0"]
clang_13_0 = ["clang_12_0"]
clang_14_0 = ["clang_13_0"]
clang_15_0 = ["clang_14_0"]
clang_16_0 = ["clang_15_0"]
clang_17_0 = ["clang_16_0"]
clang_18_0 = ["clang_17_0"]
clang_3_5 = []
clang_3_6 = ["clang_3_5"]
clang_3_7 = ["clang_3_6"]
clang_3_8 = ["clang_3_7"]
clang_3_9 = ["clang_3_8"]
clang_4_0 = ["clang_3_9"]
clang_5_0 = ["clang_4_0"]
clang_6_0 = ["clang_5_0"]
clang_7_0 = ["clang_6_0"]
clang_8_0 = ["clang_7_0"]
clang_9_0 = ["clang_8_0"]
libcpp = []
runtime = ["libloading"]
static = []

[lib]
path = "src/lib.rs"

[package]
authors = ["Kyle Mayes <kyle@mayeses.com>"]
description = "Rust bindings for libclang."
documentation = "https://docs.rs/clang-sys"
edition = "2021"
license = "Apache-2.0"
name = "clang-sys"
readme = "README.md"
repository = "https://github.com/KyleMayes/clang-sys"
version = "1.8.1"

[package.metadata.docs.rs]
features = ["clang_18_0", "runtime"]
