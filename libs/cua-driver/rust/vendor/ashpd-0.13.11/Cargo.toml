[dependencies.async-trait]
optional = true
version = "0.1"

[dependencies.enumflags2]
version = "0.7"

[dependencies.futures-channel]
optional = true
version = "0.3"

[dependencies.futures-util]
version = "0.3"

[dependencies.gdk4wayland]
optional = true
package = "gdk4-wayland"
version = "0.11"

[dependencies.gdk4x11]
features = ["xlib"]
optional = true
package = "gdk4-x11"
version = "0.11"

[dependencies.getrandom]
version = "0.4"

[dependencies.glib]
optional = true
version = "0.22"

[dependencies.gtk4]
optional = true
version = "0.11"

[dependencies.pipewire]
optional = true
version = "0.9"

[dependencies.raw-window-handle]
optional = true
version = "0.6"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dependencies.serde_repr]
optional = true
version = "0.1"

[dependencies.tokio]
default-features = false
optional = true
version = "1.43"

[dependencies.tracing]
optional = true
version = "0.1"

[dependencies.wayland-backend]
features = ["client_system"]
optional = true
version = "0.3"

[dependencies.wayland-client]
optional = true
version = "0.31"

[dependencies.wayland-protocols]
features = ["unstable", "client", "staging"]
optional = true
version = "0.32"

[dependencies.zbus]
default-features = false
version = "5.13"

[dev-dependencies.gst]
package = "gstreamer"
version = "0.25"

[dev-dependencies.pipewire]
version = "0.9.0"

[dev-dependencies.quick-xml]
version = "0.39"

[dev-dependencies.reis]
features = ["tokio"]
version = "0.6"

[dev-dependencies.serde_json]
version = "1.0"

[dev-dependencies.tokio]
features = ["rt-multi-thread", "macros"]
version = "1.41"

[features]
account = []
async-io = ["zbus/async-io", "futures-util/io"]
backend = ["dep:async-trait"]
background = []
camera = []
clipboard = []
default = ["tokio"]
documents = ["dep:serde_repr"]
dynamic_launcher = ["dep:serde_repr"]
email = []
file_chooser = ["dep:serde_repr"]
flatpak = ["dep:serde_repr"]
frontend = ["account", "background", "camera", "clipboard", "dynamic_launcher", "email", "file_chooser", "game_mode", "global_shortcuts", "inhibit", "input_capture", "location", "memory_monitor", "network_monitor", "notification", "open_uri", "power_profile_monitor", "print", "proxy_resolver", "realtime", "remote_desktop", "screencast", "screenshot", "secret", "settings", "trash", "usb", "wallpaper", "flatpak", "documents"]
game_mode = ["dep:serde_repr"]
glib = ["dep:glib"]
global_shortcuts = []
gtk4 = ["gtk4_x11", "gtk4_wayland"]
gtk4_wayland = ["gdk4wayland", "glib", "dep:gtk4", "dep:futures-channel"]
gtk4_x11 = ["gdk4x11", "glib", "dep:gtk4", "dep:futures-channel"]
inhibit = ["dep:serde_repr"]
input_capture = ["dep:serde_repr"]
location = ["dep:serde_repr"]
memory_monitor = []
network_monitor = ["dep:serde_repr"]
notification = []
open_uri = []
pipewire = ["dep:pipewire", "dep:futures-channel"]
power_profile_monitor = []
print = []
proxy_resolver = []
raw_handle = ["raw-window-handle"]
realtime = []
remote_desktop = ["dep:serde_repr"]
screencast = ["dep:serde_repr"]
screenshot = []
secret = []
settings = []
tokio = ["zbus/tokio", "dep:tokio"]
trash = ["dep:serde_repr"]
usb = []
wallpaper = []
wayland = ["wayland-client", "wayland-protocols", "wayland-backend", "dep:futures-channel"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Bilal Elmoussaoui <bil.elmoussaoui@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["gui", "os::linux-apis", "api-bindings"]
description = "XDG portals wrapper in Rust using zbus"
edition = "2024"
keywords = ["portal", "flatpak", "xdg", "desktop", "dbus"]
license = "MIT"
name = "ashpd"
readme = "README.md"
repository = "https://github.com/bilelmoussaoui/ashpd"
rust-version = "1.87"
version = "0.13.11"

[package.metadata.docs.rs]
features = ["backend", "gtk4", "raw_handle", "account", "background", "camera", "clipboard", "dynamic_launcher", "email", "file_chooser", "game_mode", "global_shortcuts", "inhibit", "input_capture", "location", "memory_monitor", "network_monitor", "notification", "open_uri", "power_profile_monitor", "print", "proxy_resolver", "realtime", "remote_desktop", "screencast", "screenshot", "secret", "settings", "trash", "usb", "wallpaper", "flatpak", "documents"]
rustdoc-args = ["--generate-link-to-definition"]
