[dependencies.libc]
version = "0.2"

[lib]
path = "src/lib.rs"

[package]
authors = ["наб <nabijaczleweli@nabijaczleweli.xyz>", "forrestsmithfb <forrest.smith@fb.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["external-ffi-bindings"]
description = "Pure FFI to Jon Blow's VS discovery script"
documentation = "https://rawcdn.githack.com/nabijaczleweli/vswhom.rs/doc/vswhom/index.html"
