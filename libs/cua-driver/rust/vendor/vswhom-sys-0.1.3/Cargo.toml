license = "MIT"
name = "vswhom-sys"
readme = "README.md"
repository = "https://github.com/nabijaczleweli/vswhom-sys.rs"
version = "0.1.3"

[target.'cfg(target_os = "windows")'.build-dependencies.cc]
version = "1.0"
