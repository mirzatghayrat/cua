[badges.maintenance]
status = "passively-maintained"

[dependencies.serde]
optional = true
version = "1.0"

[dev-dependencies.serde_json]
version = "1.0"

[features]
arch_zkasm = []
default = []
serde_support = ["serde", "std"]
std = []

[lib]
path = "src/lib.rs"

[package]
authors = ["Dan Gohman <sunfish@mozilla.com>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
categories = ["no-std"]
description = "Targeting utilities for compilers and related tools"
documentation = "https://docs.rs/target-lexicon/"
edition = "2018"
keywords = ["target", "host", "triple", "compiler", "jit"]
license = "Apache-2.0 WITH LLVM-exception"
name = "target-lexicon"
readme = "README.md"
repository = "https://github.com/bytecodealliance/target-lexicon"
version = "0.12.16"
