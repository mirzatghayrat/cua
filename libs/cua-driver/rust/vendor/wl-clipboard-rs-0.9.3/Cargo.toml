[dependencies.libc]
version = "0.2.168"

[dependencies.log]
version = "0.4.11"

[dependencies.os_pipe]
features = ["io_safety"]
version = "1.1"

[dependencies.rustix]
features = ["fs", "event"]
version = "1.0.2"

[dependencies.thiserror]
version = "2"

[dependencies.tree_magic_mini]
version = "3"

[dependencies.wayland-backend]
version = "0.3.11"

[dependencies.wayland-client]
version = "0.31.11"

[dependencies.wayland-protocols]
features = ["client", "staging"]
version = "0.32.9"

[dependencies.wayland-protocols-wlr]
features = ["client"]
version = "0.3.9"

[dev-dependencies.proptest]
version = "1"

[dev-dependencies.proptest-derive]
version = "0.7"

[dev-dependencies.wayland-protocols]
features = ["server", "staging"]
version = "0.32.9"

[dev-dependencies.wayland-protocols-wlr]
features = ["server"]
version = "0.3.9"

[dev-dependencies.wayland-server]
version = "0.31.10"

[features]
dlopen = ["native_lib", "wayland-backend/dlopen", "wayland-backend/dlopen"]
native_lib = ["wayland-backend/client_system", "wayland-backend/server_system"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Ivan Molodetskikh <yalterz@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["os"]
description = "Access to the Wayland clipboard for terminal and other window-less applications."
documentation = "https://docs.rs/wl-clipboard-rs"
edition = "2021"
keywords = ["wayland", "clipboard"]
license = "MIT/Apache-2.0"
name = "wl-clipboard-rs"
readme = "README.md"
repository = "https://github.com/YaLTeR/wl-clipboard-rs"
version = "0.9.3"
