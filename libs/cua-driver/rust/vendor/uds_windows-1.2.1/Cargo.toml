[dependencies.memoffset]
version = "0.9.0"

[lib]
path = "src/lib.rs"

[package]
authors = ["Azure IoT Edge Devs", "Harald Hoyer <harald@redhat.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["os::windows-apis"]
description = "Unix Domain Sockets for Windows!"
edition = "2021"
exclude = [".gitignore", ".github"]
keywords = ["windows", "uds", "unix", "domain", "sockets"]
license = "MIT"
name = "uds_windows"
readme = "README.md"
repository = "https://github.com/haraldh/rust_uds_windows"
rust-version = "1.85"
version = "1.2.1"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"

[target."cfg(windows)".dependencies.tempfile]
version = "3"

[target."cfg(windows)".dependencies.windows-sys]
features = ["Win32_Networking_WinSock", "Win32_Foundation", "Win32_System_Threading", "Win32_System_IO"]
version = ">=0.60, <0.62"
