[dependencies.crossbeam-utils]
default-features = false
version = "0.8.11"

[dependencies.portable-atomic]
default-features = false
optional = true
version = "1"

[dev-dependencies.criterion]
default-features = false
features = ["cargo_bench_support"]
version = "0.5"

[dev-dependencies.easy-parallel]
version = "3.1.0"

[dev-dependencies.fastrand]
version = "2.0.0"

[features]
default = ["std"]
std = []

[lib]
path = "src/lib.rs"

[package]
authors = ["Stjepan Glavina <stjepang@gmail.com>", "Taiki Endo <te316e89@gmail.com>", "John Nunley <dev@notgull.net>"]
categories = ["concurrency"]
description = "Concurrent multi-producer multi-consumer queue"
edition = "2021"
exclude = ["/.*"]
keywords = ["channel", "mpmc", "spsc", "spmc", "mpsc"]
license = "Apache-2.0 OR MIT"
name = "concurrent-queue"
readme = "README.md"
repository = "https://github.com/smol-rs/concurrent-queue"
rust-version = "1.60"
version = "2.5.0"

[target."cfg(loom)".dependencies.loom]
optional = true
version = "0.7"

[target.'cfg(target_family = "wasm")'.dev-dependencies.wasm-bindgen-test]
version = "0.3"
