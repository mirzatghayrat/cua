[dependencies.rustc_version]
version = "0.4"

[dependencies.toml]
version = "0.8"

[lib]
path = "src/lib.rs"

[package]
authors = ["наб <nabijaczleweli@nabijaczleweli.xyz>", "Cat Plus Plus <piotrlegnica@piotrl.pl>", "Liigo <liigo@qq.com>", "azyobuzin <azyobuzin@users.sourceforge.jp>", "Peter Atashian <retep998@gmail.com>", "pravic <ehysta@gmail.com>", "Gabriel Majeri <gabriel.majeri6@gmail.com>", "SonnyX", "Johan Andersson <repi@repi.se>", "Jordan Poles <jpdev.noreply@gmail.com>", "MSxDOS <melcodos@gmail.com>", "Jim McGrath <jimmc2@gmail.com>", "roblabla <unfiltered@roblab.la>", "Jasper Bekkers <jasper@traverseresearch.nl>", "Richard Markiewicz <rmarkiewicz@devolutions.net>", "Emerson de Freitas Barcelos <emersonfxbx@gmail.com>", "Li Keqing <me@kaze.ai>", "Alexis Bourget <alexis.bourget@gmail.com>", "Michael Farrell <micolous+git@gmail.com>", "Jacob Okamoto <oko@oko.io>", "Marijn Suijten <marijn@traverseresearch.nl>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["development-tools", "os::windows-apis"]
description = "A Cargo library to handle compilation and inclusion of Windows resources in the most resilient fashion imaginable"
documentation = "https://rawcdn.githack.com/nabijaczleweli/rust-embed-resource/doc/embed_resource/index.html"
exclude = ["*.enc"]
keywords = ["cargo", "build", "windows", "resource", "manifest"]
license = "MIT"
name = "embed-resource"
readme = "README.md"
repository = "https://github.com/nabijaczleweli/rust-embed-resource"
version = "2.5.2"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies.cc]
version = "1.0"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies.vswhom]
version = "0.1"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies.winreg]
default-features = false
version = "0.52"

[target.'cfg(not(target_os = "windows"))'.dependencies.cc]
version = "1.0"

[target.'cfg(not(target_os = "windows"))'.dependencies.memchr]
version = "2.7"
