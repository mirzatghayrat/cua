[dependencies.digest]
features = ["mac"]
version = "0.10.7"

[dependencies.hmac]
default-features = false
optional = true
version = "0.12"

[dependencies.password-hash]
default-features = false
features = ["rand_core"]
optional = true
version = "0.5"

[dependencies.rayon]
optional = true
version = "1.7"

[dependencies.sha1]
default-features = false
optional = true
version = "0.10"

[dependencies.sha2]
default-features = false
optional = true
version = "0.10"

[dev-dependencies.hex-literal]
version = "0.4.0"

[dev-dependencies.hmac]
version = "0.12"

[dev-dependencies.sha1]
version = "0.10"

[dev-dependencies.sha2]
version = "0.10"

[dev-dependencies.streebog]
version = "0.10"

[features]
default = ["hmac"]
parallel = ["rayon", "std"]
simple = ["hmac", "password-hash", "sha2"]
std = ["password-hash/std"]

[lib]
path = "src/lib.rs"

[package]
authors = ["RustCrypto Developers"]
categories = ["authentication", "cryptography", "no-std"]
description = "Generic implementation of PBKDF2"
documentation = "https://docs.rs/pbkdf2"
edition = "2021"
keywords = ["crypto", "hashing", "password", "phf"]
license = "MIT OR Apache-2.0"
name = "pbkdf2"
readme = "README.md"
repository = "https://github.com/RustCrypto/password-hashes/tree/master/pbkdf2"
rust-version = "1.60"
version = "0.12.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
