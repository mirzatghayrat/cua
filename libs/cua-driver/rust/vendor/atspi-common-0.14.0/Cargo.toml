[dependencies.enumflags2]
version = "0.7.9"

[dependencies.serde]
version = "1.0.200"

[dependencies.static_assertions]
version = "1.1.0"

[dependencies.zbus]
default-features = false
features = ["async-io"]
optional = true
version = "5.5"

[dependencies.zbus-lockstep]
version = "0.5.2"

[dependencies.zbus-lockstep-macros]
version = "0.5.2"

[dependencies.zbus_names]
version = "4.1.1"

[dependencies.zvariant]
default-features = false
version = "5.2"

[dev-dependencies.assert_matches]
version = "1.5.0"

[dev-dependencies.rename-item]
version = "0.1.0"

[dev-dependencies.serde_plain]
version = "1.0.1"

[dev-dependencies.static_assertions]
version = "1.1.0"

[dev-dependencies.tokio]
default-features = false
features = ["macros", "rt-multi-thread"]
version = "1.38.2"

[dev-dependencies.tokio-stream]
default-features = false
features = ["time"]
version = "0.1.1"

[dev-dependencies.tokio-test]
version = "0.4.2"

[dev-dependencies.zbus]
default-features = false
features = ["async-io"]
version = "5.5"

[dev-dependencies.zbus_xml]
version = "5.0.2"

[features]
default = ["wrappers", "zbus"]
wrappers = []
zbus = ["dep:zbus"]

[lib]
path = "src/lib.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["accessibility", "api-bindings"]
description = "Primitive types used for sending and receiving Linux accessibility events."
edition = "2021"
include = ["LICENSE-*", "README.md", "src/**/*", "xml/*"]
keywords = ["Accessibility", "Macros"]
license = "Apache-2.0 OR MIT"
name = "atspi-common"
readme = "README.md"
repository = "https://github.com/odilia-app/atspi"
rust-version = "1.77.2"
version = "0.14.0"
