[dependencies.quick-xml]
features = ["serialize", "overlapped-lists"]
version = "0.39"

[dependencies.serde]
features = ["derive"]
version = "1.0.200"

[dependencies.zbus_names]
version = "4.3.2"

[dependencies.zvariant]
version = "5.10.1"

[dev-dependencies.doc-comment]
version = "0.3.3"

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(tokio_unstable)"]
level = "warn"
priority = 0

[package]
authors = ["Zeeshan Ali Khan <zeeshanak@gnome.org>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["parsing"]
description = "API to handle D-Bus introspection XML"
edition = "2024"
keywords = ["D-Bus", "DBus", "IPC", "XML"]
license = "MIT"
name = "zbus_xml"
readme = "README.md"
repository = "https://github.com/z-galaxy/zbus/"
rust-version = "1.87"
version = "5.1.1"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "x86_64-apple-darwin", "x86_64-unknown-freebsd", "x86_64-unknown-netbsd", "aarch64-linux-android"]
