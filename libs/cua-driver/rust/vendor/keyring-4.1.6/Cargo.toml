[dependencies.keyring-core]
version = "1.0.0"

[dev-dependencies.base64]
version = "0.23.0"

[dev-dependencies.clap]
features = ["derive"]
version = "4.6.5"

[dev-dependencies.fastrand]
version = "2.5.0"

[dev-dependencies.rpassword]
version = "7.5.4"

[dev-dependencies.rprompt]
version = "2.2.0"

[dev-dependencies.zeroize]
version = "1.9.0"

[features]
cli = ["keyring-core/sample", "apple-native-keyring-store/keychain", "apple-native-keyring-store/protected", "windows-native-keyring-store", "zbus-secret-service-keyring-store", "dbus-secret-service-keyring-store", "linux-keyutils-keyring-store", "db-keystore"]
default = ["v1"]
v1 = ["apple-native-keyring-store/keychain", "windows-native-keyring-store", "zbus-secret-service-keyring-store"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Daniel Brotsky <dev@brotsky.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = "All-in-One Rust Keyring"
edition = "2024"
exclude = [".github"]
homepage = "https://github.com/open-source-cooperative/keyring-rs/wiki/Keyring"
keywords = ["password", "credential", "keychain", "keyring", "cross-platform"]
license = "MIT OR Apache-2.0"
name = "keyring"
readme = "README.md"
repository = "https://github.com/open-source-cooperative/keyring-rs"
rust-version = "1.88.0"
version = "4.1.6"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "x86_64-linux-android", "x86_64-unknown-freebsd", "aarch64-apple-darwin", "aarch64-apple-ios"]

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies.dbus-secret-service-keyring-store]
features = ["crypto-rust", "vendored"]
optional = true
version = "1.0.0"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies.zbus-secret-service-keyring-store]
features = ["crypto-rust"]
optional = true
version = "1.0.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.apple-native-keyring-store]
optional = true
version = "1.0.1"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies.db-keystore]
optional = true
version = "0.5.1"

[target.'cfg(target_os = "android")'.dependencies.android-native-keyring-store]
optional = true
version = "1.0.0"

[target.'cfg(target_os = "linux")'.dependencies.linux-keyutils-keyring-store]
optional = true
version = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies.windows-native-keyring-store]
optional = true
version = "1.1.0"
