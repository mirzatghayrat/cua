[env]
MACOSX_DEPLOYMENT_TARGET = "13.0"

# Release archives must run on clean Windows hosts without the Visual C++
# Redistributable. Keep both MSVC targets statically linked to the CRT.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Arslan's fork (ARSLAN-FORK.md at the repository root): every dependency is
# vendored for aarch64-apple-darwin, so Arslan builds this offline and downloads
# nothing: cargo build --release --locked --offline -p cua-driver
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
